[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smem"
version = "0.1.0"
description = "Sales & Marketing Effectiveness Model — a throughput model of the B2B revenue engine (reference engine, workbook builder, web API)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Scott Santucci", email = "scott@successification.com" }]
dependencies = [
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1,<4"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "openpyxl>=3.1,<4",
    "types-openpyxl>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/smem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "D107", "RUF001", "RUF002", "RUF003"]  # unicode math in docs is intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"reference/*" = ["D", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["smem"]
